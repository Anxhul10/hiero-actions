name: Verify Commits

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true

permissions:
  pull-requests: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run verification script
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/verify-commits.js');

            await script({
              github,
              context
            });