name: Verify Commits

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run verification script
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const script = require('./.github/scripts/verify-commits.js');

            await script({
              github,
              context
            });